    <rect x="240" y="268" width="29" height="10" rx="5" fill="url(#grad-markdown)" style="animation:bar-grow 1.2s cubic-bezier(.4,0,.2,1) 0.75s both"/>
    <text x="572" y="278" font-family="Courier New,monospace" font-size="11" fill="#00f5ff">5.16%</text>
  </g>
  <g style="opacity:0;animation:fadeup 0.6s ease-out 0.8999999999999999s both">
