<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="800" height="320">
  <defs>
    <style>
      .bg       { fill: #0d1117; }
      .title    { font-family: 'Courier New', monospace; font-size: 12px; fill: #00f5ff; letter-spacing: 3px; }
      .label    { font-family: 'Courier New', monospace; font-size: 12px; fill: #8b949e; }
      .val      { font-family: 'Courier New', monospace; font-size: 12px; fill: #e6edf3; font-weight: bold; }
      .pct      { font-family: 'Courier New', monospace; font-size: 11px; fill: #00f5ff; }
      .divider  { stroke: #21262d; stroke-width: 1; }
      .dot-py   { fill: #3fb950; filter: drop-shadow(0 0 4px #3fb950); }
      .dot-js   { fill: #e3b341; filter: drop-shadow(0 0 4px #e3b341); }
      .dot-css  { fill: #a78bfa; filter: drop-shadow(0 0 4px #a78bfa); }
      .dot-html { fill: #f97583; filter: drop-shadow(0 0 4px #f97583); }
      .dot-java { fill: #00f5ff; filter: drop-shadow(0 0 4px #00f5ff); }
      .box-val  { font-family: 'Courier New', monospace; font-size: 22px; font-weight: bold; fill: #00f5ff; filter: drop-shadow(0 0 8px #00f5ff66); }
      .box-lbl  { font-family: 'Courier New', monospace; font-size: 9px; fill: #8b949e; letter-spacing: 2px; }

      @keyframes bar-grow-py   { from{width:0} to{width:25px}  }
      @keyframes bar-grow-html { from{width:0} to{width:114px} }
      @keyframes bar-grow-css  { from{width:0} to{width:135px} }
      @keyframes bar-grow-js   { from{width:0} to{width:178px} }
      @keyframes bar-grow-java { from{width:0} to{width:262px} }
      @keyframes fadeup { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }

      .bar-py-r   { animation: bar-grow-py   1.2s cubic-bezier(.4,0,.2,1) 0.3s both; }
      .bar-html-r { animation: bar-grow-html 1.2s cubic-bezier(.4,0,.2,1) 0.5s both; }
      .bar-css-r  { animation: bar-grow-css  1.2s cubic-bezier(.4,0,.2,1) 0.7s both; }
      .bar-js-r   { animation: bar-grow-js   1.2s cubic-bezier(.4,0,.2,1) 0.9s both; }
      .bar-java-r { animation: bar-grow-java 1.2s cubic-bezier(.4,0,.2,1) 1.1s both; }

      .s1 { animation: fadeup 0.6s ease-out 0.1s both; }
      .s2 { animation: fadeup 0.6s ease-out 0.3s both; }
      .s3 { animation: fadeup 0.6s ease-out 0.5s both; }
      .s4 { animation: fadeup 0.6s ease-out 0.7s both; }
      .s5 { animation: fadeup 0.6s ease-out 0.9s both; }
    </style>

    <linearGradient id="grad-py" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3fb950" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#3fb950"/>
    </linearGradient>
    <linearGradient id="grad-js" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e3b341" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#e3b341"/>
    </linearGradient>
    <linearGradient id="grad-css" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="grad-html" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97583" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#f97583"/>
    </linearGradient>
    <linearGradient id="grad-java" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5ff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#00f5ff"/>
    </linearGradient>
    <linearGradient id="top-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#00f5ff" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#00f5ff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#00f5ff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect class="bg" width="800" height="320" rx="12"/>
  <rect x="0" y="0" width="800" height="2" rx="1" fill="url(#top-line)"/>

  <text class="title s1" x="30" y="35">⏱  CODING STATS</text>
  <line x1="30" y1="42" x2="770" y2="42" class="divider"/>

  <!-- Stat boxes -->
  <g class="s1">
    <rect x="30"  y="54" width="168" height="64" rx="8" fill="#0d1117" stroke="#21262d" stroke-width="1"/>
    <rect x="30"  y="54" width="168" height="2"  rx="1" fill="#00f5ff" opacity="0.6"/>
    <text class="box-val" x="114" y="90" text-anchor="middle">92h 33m</text>
    <text class="box-lbl" x="114" y="107" text-anchor="middle">TOTAL TIME CODED</text>
  </g>
  <g class="s2">
    <rect x="214" y="54" width="168" height="64" rx="8" fill="#0d1117" stroke="#21262d" stroke-width="1"/>
    <rect x="214" y="54" width="168" height="2"  rx="1" fill="#3fb950" opacity="0.6"/>
    <text class="box-val" x="298" y="90" text-anchor="middle" style="fill:#3fb950;filter:drop-shadow(0 0 8px #3fb95066)">~1h 32m</text>
    <text class="box-lbl" x="298" y="107" text-anchor="middle">DAILY AVERAGE</text>
  </g>
  <g class="s3">
    <rect x="398" y="54" width="168" height="64" rx="8" fill="#0d1117" stroke="#21262d" stroke-width="1"/>
    <rect x="398" y="54" width="168" height="2"  rx="1" fill="#e3b341" opacity="0.6"/>
    <text class="box-val" x="482" y="90" text-anchor="middle" style="fill:#e3b341;filter:drop-shadow(0 0 8px #e3b34166)">Saturday</text>
    <text class="box-lbl" x="482" y="107" text-anchor="middle">BEST DAY</text>
  </g>
  <g class="s4">
    <rect x="582" y="54" width="188" height="64" rx="8" fill="#0d1117" stroke="#21262d" stroke-width="1"/>
    <rect x="582" y="54" width="188" height="2"  rx="1" fill="#a78bfa" opacity="0.6"/>
    <text class="box-val" x="676" y="90" text-anchor="middle" style="fill:#a78bfa;filter:drop-shadow(0 0 8px #a78bfa66)">101</text>
    <text class="box-lbl" x="676" y="107" text-anchor="middle">TOTAL COMMITS</text>
  </g>

  <line x1="30" y1="136" x2="770" y2="136" class="divider"/>
  <text class="title s1" x="30" y="157" style="font-size:10px">LANGUAGES</text>

  <!-- Python -->
  <g class="s1">
    <circle class="dot-py"   cx="42" cy="178" r="4"/>
    <text class="label" x="58"  y="182">Python</text>
    <text class="val"   x="148" y="182">2h 56m</text>
    <rect x="240" y="172" width="320" height="10" rx="5" fill="#161b22"/>
    <rect class="bar-py-r"   x="240" y="172" width="25"  height="10" rx="5" fill="url(#grad-py)"/>
    <text class="pct"   x="572" y="182">03.17%</text>
  </g>

  <!-- HTML -->
  <g class="s2">
    <circle class="dot-html"  cx="42" cy="210" r="4"/>
    <text class="label" x="58"  y="214">HTML</text>
    <text class="val"   x="148" y="214">13h 13m</text>
    <rect x="240" y="204" width="320" height="10" rx="5" fill="#161b22"/>
    <rect class="bar-html-r"  x="240" y="204" width="114" height="10" rx="5" fill="url(#grad-html)"/>
    <text class="pct"   x="572" y="214">14.28%</text>
  </g>

  <!-- CSS -->
  <g class="s3">
    <circle class="dot-css"   cx="42" cy="242" r="4"/>
    <text class="label" x="58"  y="246">CSS</text>
    <text class="val"   x="148" y="246">15h 40m</text>
    <rect x="240" y="236" width="320" height="10" rx="5" fill="#161b22"/>
    <rect class="bar-css-r"   x="240" y="236" width="135" height="10" rx="5" fill="url(#grad-css)"/>
    <text class="pct"   x="572" y="246">16.93%</text>
  </g>

  <!-- JavaScript -->
  <g class="s4">
    <circle class="dot-js"    cx="42" cy="274" r="4"/>
    <text class="label" x="58"  y="278">JavaScript</text>
    <text class="val"   x="148" y="278">20h 31m</text>
    <rect x="240" y="268" width="320" height="10" rx="5" fill="#161b22"/>
    <rect class="bar-js-r"    x="240" y="268" width="178" height="10" rx="5" fill="url(#grad-js)"/>
    <text class="pct"   x="572" y="278">22.18%</text>
  </g>

  <!-- Java -->
  <g class="s5">
    <circle class="dot-java"  cx="42" cy="306" r="4"/>
    <text class="label" x="58"  y="310">Java</text>
    <text class="val"   x="148" y="310">30h 21m</text>
    <rect x="240" y="300" width="320" height="10" rx="5" fill="#161b22"/>
    <rect class="bar-java-r"  x="240" y="300" width="262" height="10" rx="5" fill="url(#grad-java)"/>
    <text class="pct"   x="572" y="310">32.80%</text>
  </g>

</svg>
