<svg width="680" height="440" viewBox="0 0 680 440" xmlns="http://www.w3.org/2000/svg" font-family="'Courier New', Courier, monospace">
  <defs>
    <style>
      .cursor { animation: blink 0.9s step-end infinite; }
      @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }
    </style>
  </defs>

  <rect x="10" y="10" width="660" height="420" rx="10" fill="#1E1E2E" stroke="#3A3A5C" stroke-width="0.5"/>
  <rect x="10" y="10" width="660" height="36" rx="10" fill="#2A2A3E"/>
  <rect x="10" y="34" width="660" height="12" fill="#2A2A3E"/>
  <circle cx="38" cy="28" r="7" fill="#FF5F57"/>
  <circle cx="60" cy="28" r="7" fill="#FEBC2E"/>
  <circle cx="82" cy="28" r="7" fill="#28C840"/>
  <text x="340" y="33" text-anchor="middle" fill="#8888AA" font-size="12">user@github: ~</text>

  <!-- whoami -->
  <text x="30" y="76" fill="#A6E3A1" font-size="13" font-weight="bold">➜</text>
  <text x="48" y="76" fill="#89DCEB" font-size="13">whoami</text>
  <text x="30" y="96" fill="#CDD6F4" font-size="12.5">cs undergrad — backend dev + ai engineer. building things that think.</text>

  <!-- cat skills.py -->
  <text x="30" y="120" fill="#A6E3A1" font-size="13" font-weight="bold">➜</text>
  <text x="48" y="120" fill="#89DCEB" font-size="13">cat skills.py</text>

  <text x="30" y="140" fill="#89B4FA" font-size="12">languages</text>
  <text x="124" y="140" fill="#CDD6F4" font-size="12"> = </text>
  <text x="147" y="140" fill="#A6E3A1" font-size="12">["Python", "Java", "JavaScript", "C"]</text>

  <text x="30" y="158" fill="#89B4FA" font-size="12">backend  </text>
  <text x="124" y="158" fill="#CDD6F4" font-size="12"> = </text>
  <text x="147" y="158" fill="#F38BA8" font-size="12">"Django · DRF · FastAPI · Flask · REST APIs"</text>

  <text x="30" y="176" fill="#89B4FA" font-size="12">ai_stack </text>
  <text x="124" y="176" fill="#CDD6F4" font-size="12"> = </text>
  <text x="147" y="176" fill="#F38BA8" font-size="12">"LLMs · RAG · LangChain · Gemini API · Groq · Agentic AI"</text>

  <text x="30" y="194" fill="#89B4FA" font-size="12">currently</text>
  <text x="124" y="194" fill="#CDD6F4" font-size="12"> = </text>
  <text x="147" y="194" fill="#F38BA8" font-size="12">"Integrating AI into production web apps"</text>

  <text x="30" y="212" fill="#89B4FA" font-size="12">fun_fact </text>
  <text x="124" y="212" fill="#CDD6F4" font-size="12"> = </text>
  <text x="147" y="212" fill="#F38BA8" font-size="12">"I wire LLMs to backends and call it a feature"</text>

  <!-- git log -->
  <text x="30" y="238" fill="#A6E3A1" font-size="13" font-weight="bold">➜</text>
  <text x="48" y="238" fill="#89DCEB" font-size="13">git log --oneline -3</text>

  <text x="30" y="258" fill="#F9E2AF" font-size="12">a1b2c3d</text>
  <text x="94" y="258" fill="#CDD6F4" font-size="12"> feat: asked the AI to fix itself. it almost did.</text>

  <text x="30" y="276" fill="#F9E2AF" font-size="12">e4f5g6h</text>
  <text x="94" y="276" fill="#CDD6F4" font-size="12"> fix: stopped the LLM from confidently being wrong</text>

  <text x="30" y="294" fill="#F9E2AF" font-size="12">i7j8k9l</text>
  <text x="94" y="294" fill="#CDD6F4" font-size="12"> init: hello world. the backend never sleeps.</text>

  <!-- echo $MOTTO -->
  <text x="30" y="322" fill="#A6E3A1" font-size="13" font-weight="bold">➜</text>
  <text x="48" y="322" fill="#89DCEB" font-size="13">echo $MOTTO</text>
  <text x="30" y="346" fill="#CDD6F4" font-size="13">"ship the backend. plug in the AI. make it do something useful."</text>

  <!-- final prompt + blinking cursor -->
  <text x="30" y="376" fill="#A6E3A1" font-size="13" font-weight="bold">➜</text>
  <rect x="48" y="363" width="9" height="15" fill="#A6E3A1" class="cursor"/>
</svg>
