<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340">
  <defs>
    <style>
      .bg       { fill: #0d1117; }
      .titlebar { fill: #1c2128; }
      .dot-r    { fill: #ff5f57; }
      .dot-y    { fill: #febc2e; }
      .dot-g    { fill: #28c840; }
      .term     { font-family: 'Courier New', monospace; font-size: 13px; }
      .prompt   { fill: #00f5ff; }
      .cmd      { fill: #e6edf3; }
      .out      { fill: #8b949e; }
      .green    { fill: #3fb950; }
      .cyan     { fill: #79c0ff; }
      .yellow   { fill: #e3b341; }
      .cursor   { fill: #00f5ff; }

      .l1  { opacity:0; animation: show 0s 0.3s forwards; }
      .l2  { opacity:0; animation: show 0s 1.2s forwards; }
      .l3  { opacity:0; animation: show 0s 1.5s forwards; }
      .l4  { opacity:0; animation: show 0s 2.0s forwards; }
      .l5  { opacity:0; animation: show 0s 2.5s forwards; }
      .l6  { opacity:0; animation: show 0s 3.0s forwards; }
      .l7  { opacity:0; animation: show 0s 3.5s forwards; }
      .l8  { opacity:0; animation: show 0s 4.4s forwards; }
      .l9  { opacity:0; animation: show 0s 4.7s forwards; }
      .l10 { opacity:0; animation: show 0s 5.0s forwards; }
      .l11 { opacity:0; animation: show 0s 5.3s forwards; }
      .l12 { opacity:0; animation: show 0s 6.0s forwards; }
      .l13 { opacity:0; animation: show 0s 6.3s forwards; }
      .l14 { opacity:0; animation: show 0s 7.0s forwards; }

      @keyframes show  { to { opacity: 1; } }
      @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
      .cursor { animation: blink 1s step-end infinite; }

      @keyframes scanline {
        0%   { transform: translateY(0); opacity: 0.04; }
        100% { transform: translateY(340px); opacity: 0.04; }
      }
      .scanline { animation: scanline 4s linear infinite; }
    </style>
  </defs>

  <rect class="bg" width="800" height="340" rx="10"/>
  <rect class="titlebar" x="0" y="0" width="800" height="36" rx="10"/>
  <rect class="titlebar" x="0" y="18" width="800" height="18"/>
  <circle class="dot-r" cx="20" cy="18" r="6"/>
  <circle class="dot-y" cx="40" cy="18" r="6"/>
  <circle class="dot-g" cx="60" cy="18" r="6"/>
  <text x="400" y="23" text-anchor="middle"
        font-family="'Courier New', monospace" font-size="12" fill="#8b949e">
    asiiyaah@github: ~
  </text>
  <rect class="scanline" x="0" y="0" width="800" height="3" fill="#00f5ff"/>

  <!-- whoami -->
  <g class="term l1">
    <text x="20" y="68"><tspan class="prompt">❯ </tspan><tspan class="cmd">whoami</tspan></text>
  </g>
  <g class="term l2">
    <text x="20" y="88" class="green">asiiyaah — student developer. still learning. always building. 🚀</text>
  </g>

  <!-- cat skills.py -->
  <g class="term l3">
    <text x="20" y="112"><tspan class="prompt">❯ </tspan><tspan class="cmd">cat skills.py</tspan></text>
  </g>
  <g class="term l4">
    <text x="20" y="132" class="out">languages  =  [<tspan class="yellow">"Python"</tspan>, <tspan class="yellow">"HTML"</tspan>, <tspan class="yellow">"CSS"</tspan>, <tspan class="yellow">"JavaScript"</tspan>, <tspan class="yellow">"C"</tspan>]</text>
  </g>
  <g class="term l5">
    <text x="20" y="150" class="out">currently  =  <tspan class="green">"Learning AI &amp; teaching machines to think 🤖"</tspan></text>
  </g>
  <g class="term l6">
    <text x="20" y="168" class="out">status     =  <tspan class="cyan">"Student dev — learning every single day"</tspan></text>
  </g>
  <g class="term l7">
    <text x="20" y="186" class="out">fun_fact   =  <tspan class="yellow">"I break things to understand them 😅"</tspan></text>
  </g>

  <!-- git log -->
  <g class="term l8">
    <text x="20" y="210"><tspan class="prompt">❯ </tspan><tspan class="cmd">git log --oneline -3</tspan></text>
  </g>
  <g class="term l9">
    <text x="20" y="228" class="out"><tspan class="yellow">a1b2c3d</tspan>  feat: stayed up till 3am debugging 🌙</text>
  </g>
  <g class="term l10">
    <text x="20" y="246" class="out"><tspan class="yellow">e4f5g6h</tspan>  fix: finally understood recursion 🧠</text>
  </g>
  <g class="term l11">
    <text x="20" y="264" class="out"><tspan class="yellow">i7j8k9l</tspan>  init: started the journey. no going back.</text>
  </g>

  <!-- echo -->
  <g class="term l12">
    <text x="20" y="288"><tspan class="prompt">❯ </tspan><tspan class="cmd">echo $MOTTO</tspan></text>
  </g>
  <g class="term l13">
    <text x="20" y="306" class="green">"The expert was once a beginner. Keep going."</text>
  </g>

  <!-- cursor -->
  <g class="term l14">
    <text x="20" y="326"><tspan class="prompt">❯ </tspan><tspan class="cursor">█</tspan></text>
  </g>
</svg>
