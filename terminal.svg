<svg width="700" height="660" viewBox="0 0 700 660" xmlns="http://www.w3.org/2000/svg" font-family="'SF Mono','Fira Code',Consolas,Monaco,monospace">
  <defs>
    <clipPath id="cardClip">
      <rect x="20" y="20" width="660" height="620" rx="14"/>
    </clipPath>
  </defs>

  <!-- card background -->
  <rect x="20" y="20" width="660" height="620" rx="14" fill="#13131f" stroke="#2a2a3d" stroke-width="1"/>

  <g clip-path="url(#cardClip)">
    <!-- header bar -->
    <rect x="20" y="20" width="660" height="40" fill="#1c1c2b"/>
    <line x1="20" y1="60" x2="680" y2="60" stroke="#2a2a3d" stroke-width="1"/>

    <!-- traffic lights -->
    <circle cx="42" cy="40" r="6" fill="#ff5f57"/>
    <circle cx="62" cy="40" r="6" fill="#febc2e"/>
    <circle cx="82" cy="40" r="6" fill="#28c840"/>

    <!-- title -->
    <text x="350" y="44" text-anchor="middle" font-size="13" fill="#6c7086">user@github: ~</text>

    <!-- terminal content -->
    <g font-size="13.5" xml:space="preserve">

      <!-- row0 -->
      <text x="40" y="90"><tspan fill="#50fa7b">➜ </tspan><tspan fill="#7aa2f7">whoami</tspan></text>
      <!-- row1 -->
      <text x="40" y="112" fill="#c0caf5">cs undergrad — backend dev + ai engineer. building things that think.</text>

      <!-- row3 -->
      <text x="40" y="156"><tspan fill="#50fa7b">➜ </tspan><tspan fill="#7aa2f7">cat skills.py</tspan></text>

      <!-- row4 languages -->
      <text x="40" y="178"><tspan fill="#7aa2f7">languages</tspan><tspan fill="#c0caf5">   = [</tspan><tspan fill="#e0af68">"Python", "Java", "JavaScript", "TypeScript", "C"</tspan><tspan fill="#c0caf5">]</tspan></text>

      <!-- row5 backend -->
      <text x="40" y="200"><tspan fill="#7aa2f7">backend</tspan><tspan fill="#c0caf5">     = </tspan><tspan fill="#e0af68">"Django · DRF · FastAPI · Flask · Express · REST APIs"</tspan></text>

      <!-- row6 frontend -->
      <text x="40" y="222"><tspan fill="#7aa2f7">frontend</tspan><tspan fill="#c0caf5">    = </tspan><tspan fill="#e0af68">"React · Next.js"</tspan></text>

      <!-- row7 runtime -->
      <text x="40" y="244"><tspan fill="#7aa2f7">runtime</tspan><tspan fill="#c0caf5">     = </tspan><tspan fill="#e0af68">"Node.js"</tspan></text>

      <!-- row8 ai_stack -->
      <text x="40" y="266"><tspan fill="#7aa2f7">ai_stack</tspan><tspan fill="#c0caf5">    = </tspan><tspan fill="#e0af68">"LLMs · RAG · LangChain · Gemini API · Groq · Agentic AI"</tspan></text>

      <!-- row9 currently -->
      <text x="40" y="288"><tspan fill="#7aa2f7">currently</tspan><tspan fill="#c0caf5">   = </tspan><tspan fill="#e0af68">"Integrating AI into production web apps"</tspan></text>

      <!-- row10 fun_fact -->
      <text x="40" y="310"><tspan fill="#7aa2f7">fun_fact</tspan><tspan fill="#c0caf5">    = </tspan><tspan fill="#e0af68">"I wire LLMs to backends and call it a feature"</tspan></text>

      <!-- row12 git log -->
      <text x="40" y="354"><tspan fill="#50fa7b">➜ </tspan><tspan fill="#7aa2f7">git log --oneline -3</tspan></text>

      <!-- row13 -->
      <text x="40" y="376"><tspan fill="#e0af68">a1b2c3d</tspan><tspan fill="#c0caf5"> feat: asked the AI to fix itself. it almost did.</tspan></text>

      <!-- row14 -->
      <text x="40" y="398"><tspan fill="#e0af68">e4f5g6h</tspan><tspan fill="#c0caf5"> fix: stopped the LLM from confidently being wrong</tspan></text>

      <!-- row15 -->
      <text x="40" y="420"><tspan fill="#e0af68">i7j8k9l</tspan><tspan fill="#c0caf5"> init: hello world. the backend never sleeps.</tspan></text>

      <!-- row17 echo -->
      <text x="40" y="464"><tspan fill="#50fa7b">➜ </tspan><tspan fill="#7aa2f7">echo $MOTTO</tspan></text>

      <!-- row18 -->
      <text x="40" y="486"><tspan fill="#e0af68">"ship the backend. plug in the AI. make it do something useful."</tspan></text>

      <!-- row20 final prompt + cursor -->
      <text x="40" y="530"><tspan fill="#50fa7b">➜ </tspan></text>
      <rect x="60" y="518" width="9" height="16" fill="#c0caf5">
        <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.49;0.5;1" dur="1s" repeatCount="indefinite"/>
      </rect>

    </g>
  </g>
</svg>
