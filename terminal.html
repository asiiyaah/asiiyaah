<!DOCTYPE html>
<div style="padding: 8px 0;">
<div id="term" style="background:#1E1E2E; border-radius:10px; border:0.5px solid #3A3A5C; font-family:monospace; font-size:13px; padding:0; overflow:hidden;">
  <div style="background:#2A2A3E; padding:10px 16px; display:flex; align-items:center; gap:10px; border-radius:10px 10px 0 0;">
    <span style="width:14px;height:14px;border-radius:50%;background:#FF5F57;display:inline-block;"></span>
    <span style="width:14px;height:14px;border-radius:50%;background:#FEBC2E;display:inline-block;"></span>
    <span style="width:14px;height:14px;border-radius:50%;background:#28C840;display:inline-block;"></span>
    <span style="flex:1;text-align:center;color:#8888AA;font-size:12px;">user@github: ~</span>
  </div>
  <div id="output" style="padding:16px 20px 20px; line-height:1.75; min-height:320px;"></div>
</div>
</div>

<script>
const out = document.getElementById('output');
let html = '';

const G = '#A6E3A1';
const C = '#89DCEB';
const B = '#89B4FA';
const P = '#F38BA8';
const Y = '#F9E2AF';
const W = '#CDD6F4';
const D = '#8888AA';

const lines = [
  { type: 'prompt', cmd: 'whoami' },
  { type: 'output', color: W, text: 'cs undergrad — backend dev + ai engineer. building things that think.' },
  { type: 'blank' },
  { type: 'prompt', cmd: 'cat skills.py' },
  { type: 'code', key: 'languages', keyColor: B, val: '= ["Python", "Java", "JavaScript", "C"]', valColor: G },
  { type: 'code', key: 'backend  ', keyColor: B, val: '= "Django · DRF · FastAPI · Flask · REST APIs"', valColor: P },
  { type: 'code', key: 'ai_stack ', keyColor: B, val: '= "LLMs · RAG · Gemini API · Groq · Agentic AI"', valColor: P },
  { type: 'code', key: 'currently', keyColor: B, val: '= "Integrating AI into production web apps"', valColor: P },
  { type: 'code', key: 'fun_fact ', keyColor: B, val: '= "I wire LLMs to backends and call it a feature"', valColor: P },
  { type: 'blank' },
  { type: 'prompt', cmd: 'git log --oneline -3' },
  { type: 'git', hash: 'a1b2c3d', msg: 'feat: built RAG pipeline with Gemini + vector search' },
  { type: 'git', hash: 'e4f5g6h', msg: 'fix: stopped the LLM from confidently being wrong' },
  { type: 'git', hash: 'i7j8k9l', msg: 'init: hello world. the backend never sleeps.' },
  { type: 'blank' },
  { type: 'prompt', cmd: 'echo $MOTTO' },
  { type: 'output', color: W, text: '"ship the backend. plug in the AI. make it do something useful."' },
  { type: 'cursor' },
];

function span(color, text) {
  return `<span style="color:${color}">${text}</span>`;
}

function renderLine(line) {
  if (line.type === 'blank') return '<div style="height:6px"></div>';
  if (line.type === 'prompt') return `<div>${span(G,'➜')} ${span(C, line.cmd)}</div>`;
  if (line.type === 'output') return `<div style="padding-left:4px">${span(line.color, line.text)}</div>`;
  if (line.type === 'code') return `<div style="padding-left:4px">${span(line.keyColor, line.key)} ${span(W,'  ')}${span(line.valColor, line.val)}</div>`;
  if (line.type === 'git') return `<div style="padding-left:4px">${span(Y, line.hash)} ${span(W, line.msg)}</div>`;
  if (line.type === 'cursor') return `<div style="margin-top:4px">${span(G,'➜')} <span id="cursor" style="display:inline-block;width:9px;height:14px;background:${G};opacity:0.85;vertical-align:-2px;"></span></div>`;
  return '';
}

async function typeText(el, text, speed) {
  for (let i = 0; i < text.length; i++) {
    el.innerHTML += text[i] === '<' ? '' : text[i];
    await delay(speed);
  }
}

function delay(ms) { return new Promise(r => setTimeout(r, ms)); }

async function streamLine(line, index) {
  if (line.type === 'blank') {
    out.innerHTML += '<div style="height:6px"></div>';
    return;
  }

  if (line.type === 'cursor') {
    out.innerHTML += renderLine(line);
    const cur = document.getElementById('cursor');
    if (cur) setInterval(() => cur.style.opacity = cur.style.opacity === '0' ? '0.85' : '0', 530);
    return;
  }

  if (line.type === 'prompt') {
    const div = document.createElement('div');
    div.innerHTML = span(G, '➜') + ' ';
    out.appendChild(div);
    await delay(300);
    const cmdSpan = document.createElement('span');
    cmdSpan.style.color = C;
    div.appendChild(cmdSpan);
    for (const ch of line.cmd) {
      cmdSpan.textContent += ch;
      await delay(42);
    }
    await delay(180);
    return;
  }

  const div = document.createElement('div');
  div.style.paddingLeft = '4px';
  out.appendChild(div);

  if (line.type === 'output') {
    const s = document.createElement('span');
    s.style.color = line.color;
    div.appendChild(s);
    for (const ch of line.text) { s.textContent += ch; await delay(18); }
  }

  if (line.type === 'code') {
    const k = document.createElement('span');
    k.style.color = line.keyColor;
    k.textContent = line.key + '  ';
    div.appendChild(k);
    const v = document.createElement('span');
    v.style.color = line.valColor;
    div.appendChild(v);
    for (const ch of line.val) { v.textContent += ch; await delay(14); }
  }

  if (line.type === 'git') {
    const h = document.createElement('span');
    h.style.color = Y;
    h.textContent = line.hash + ' ';
    div.appendChild(h);
    const m = document.createElement('span');
    m.style.color = W;
    div.appendChild(m);
    for (const ch of line.msg) { m.textContent += ch; await delay(16); }
  }
}

async function run() {
  await delay(400);
  for (let i = 0; i < lines.length; i++) {
    await streamLine(lines[i], i);
    if (lines[i].type !== 'blank' && lines[i].type !== 'cursor') await delay(60);
  }
}

run();
</script>
